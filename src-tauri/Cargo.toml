[package]
name = "fusewriter"
version = "0.1.0"
description = "FuseWriter - a quiet, private desktop writing app"
authors = ["MeHashOnHold"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "fusewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
harper-core = { version = "=3.2.0", features = ["concurrent"] }
regex = "1.13.2"
thiserror = "2.0.21"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "process"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"

[dev-dependencies]
wiremock = "0.6.5"
