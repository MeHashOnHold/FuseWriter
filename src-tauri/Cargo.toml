[package]
name = "fusewriter"
version = "0.1.0"
description = "FuseWriter - a quiet, private desktop writing app"
authors = ["MeHashOnHold"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "fusewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
